<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineNova - Cuenta</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background: radial-gradient(circle at center, #1b202d 0%, #0a0c10 100%); margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">

  <div style="width: 100%; max-width: 440px; padding: 2rem;">
    <!-- Tarjeta con degradado y brillo rojo -->
    <div class="modal-content" style="background: linear-gradient(145deg, #141824, #0b0e14); padding: 2.5rem; border-radius: 16px; border: 2px solid var(--accent-red); box-shadow: 0 0 25px rgba(229, 9, 20, 0.3), 0 15px 35px rgba(0,0,0,0.7);">
      
      <div class="logo" style="text-align: center; margin-bottom: 1.5rem; font-size: 2.2rem; font-weight: 800; letter-spacing: 1px;">
        Cine<span>Nova</span>
      </div>
      
      <!-- ================= CONTENEDOR 1: LOGIN / REGISTRO ================= -->
      <div id="authContainer">
        <h3 id="formTitle" class="modal-title" style="text-align: center; margin-bottom: 1.8rem; color: var(--text-main); font-size: 1.4rem; letter-spacing: 0.5px;">Iniciar Sesión</h3>
        
        <!-- Mensaje de alerta visual -->
        <div id="errorMsg" style="display: none; background-color: rgba(229, 9, 20, 0.2); border: 1px solid var(--accent-red); color: #ff6b6b; padding: 0.8rem; border-radius: 8px; margin-bottom: 1.2rem; font-size: 0.85rem; text-align: center; font-weight: 500;"></div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
          
          <!-- Campo Fecha de Nacimiento (Solo visible al registrarse) -->
          <div id="birthdateContainer" style="display: none;">
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Fecha de Nacimiento</label>
            <div style="display: flex; gap: 0.5rem;">
              <!-- Día -->
              <select id="birthDay" style="flex: 1; padding: 0.8rem; border-radius: 8px; border: 1px solid #323846; background: #0e1118; color: #fff; font-size: 0.9rem; outline: none; cursor: pointer;">
                <option value="" disabled selected>Día</option>
              </select>
              <!-- Mes -->
              <select id="birthMonth" style="flex: 1.3; padding: 0.8rem; border-radius: 8px; border: 1px solid #323846; background: #0e1118; color: #fff; font-size: 0.9rem; outline: none; cursor: pointer;">
                <option value="" disabled selected>Mes</option>
                <option value="1">Enero</option>
                <option value="2">Febrero</option>
                <option value="3">Marzo</option>
                <option value="4">Abril</option>
                <option value="5">Mayo</option>
                <option value="6">Junio</option>
                <option value="7">Julio</option>
                <option value="8">Agosto</option>
                <option value="9">Septiembre</option>
                <option value="10">Octubre</option>
                <option value="11">Noviembre</option>
                <option value="12">Diciembre</option>
              </select>
              <!-- Año -->
              <select id="birthYear" style="flex: 1.2; padding: 0.8rem; border-radius: 8px; border: 1px solid #323846; background: #0e1118; color: #fff; font-size: 0.9rem; outline: none; cursor: pointer;">
                <option value="" disabled selected>Año</option>
              </select>
            </div>
          </div>

          <div>
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Correo electrónico</label>
            <input type="email" id="loginEmail" placeholder="usuario@cinenova.com" required style="width: 100%; padding: 0.9rem; border-radius: 8px; border: 1px solid #323846; background: #0e1118; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s;">
          </div>
          
          <div>
            <label style="color: var(--text-muted); font-size: 0.85rem; display: block; margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required style="width: 100%; padding: 0.9rem; border-radius: 8px; border: 1px solid #323846; background: #0e1118; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.3s;">
          </div>
          
          <!-- Botón con degradado rojo brillante y sombra -->
          <button type="submit" id="btnSubmit" class="btn-confirmar" style="margin-top: 0.8rem; background: linear-gradient(135deg, #ff1e2b 0%, #c9020e 100%); color: white; width: 100%; padding: 0.95rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(229, 9, 20,.4); transition: transform 0.2s, box-shadow 0.2s;">Ingresar</button>
        </form>

        <!-- Alternar entre Login y Registro -->
        <div id="toggleContainer" style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          <span id="toggleText">¿No tienes cuenta?</span> 
          <a href="#" id="toggleMode" style="color: var(--accent-gold); text-decoration: none; font-weight: 600; margin-left: 5px; transition: opacity 0.2s;">Regístrate aquí</a>
        </div>

        <div style="text-align: center; margin-top: 1.2rem; font-size: 0.85rem; border-top: 1px solid #222734; padding-top: 1.2rem;">
          <a href="./index.html" style="color: var(--accent-gold); text-decoration: none; font-weight: 600; letter-spacing: 0.5px;">Volver a la cartelera</a>
        </div>
      </div>

      <!-- ================= CONTENEDOR 2: PERFIL / CERRAR SESIÓN (OCULTO SI NO HAY SESIÓN) ================= -->
      <div id="profileContainer" style="display: none; text-align: center;">
        <h3 class="modal-title" style="color: var(--text-main); font-size: 1.4rem; margin-bottom: 1rem; letter-spacing: 0.5px;">Mi Cuenta Activa</h3>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.3rem;">Sesión iniciada como:</p>
        <p id="profileUser" style="color: #fff; font-weight: bold; font-size: 1.1rem; margin-bottom: 0.6rem;"></p>
        <p id="profileBirthdate" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.8rem;"></p>
        
        <!-- Botón de Cerrar Sesión con el mismo diseño llamativo -->
        <button id="btnLogout" style="background: linear-gradient(135deg, #ff1e2b 0%, #c9020e 100%); color: white; width: 100%; padding: 0.95rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(229, 9, 20,.4); margin-bottom: 1.2rem; transition: transform 0.2s;">Cerrar Sesión</button>
        
        <div style="border-top: 1px solid #222734; padding-top: 1.2rem;">
          <a href="./index.html" style="color: var(--accent-gold); text-decoration: none; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.5px;">Volver a la cartelera</a>
        </div>
      </div>

    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
