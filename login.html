<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineNova - Iniciar Sesión</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: var(--bg-dark);">

  <div style="width: 100%; max-width: 400px; padding: 2rem;">
    <div class="modal-content" style="background-color: var(--bg-card); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--accent-red); box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      
      <div class="logo" style="text-align: center; margin-bottom: 1.5rem; font-size: 2rem;">
        Cine<span>Nova</span>
      </div>
      
      <h3 class="modal-title" style="text-align: center; margin-bottom: 1.5rem; color: var(--text-main);">Iniciar Sesión</h3>
      
      <form id="loginForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem; display: block; margin-bottom: 0.4rem;">Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="usuario@cinenova.com" required style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #2a2e39; background: #141721; color: #fff;">
        </div>
        
        <div>
          <label style="color: var(--text-muted); font-size: 0.9rem; display: block; margin-bottom: 0.4rem;">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required style="width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #2a2e39; background: #141721; color: #fff;">
        </div>
        
        <button type="submit" class="btn-confirmar" style="margin-top: 0.5rem; background-color: var(--accent-red); color: white; width: 100%; padding: 0.8rem; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Ingresar</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
        <a href="./index.html" style="color: var(--accent-gold); text-decoration: none; font-weight: 600;">Volver a la cartelera</a>
      </div>

    </div>
  </div>

  <script src="./login.js"></script>
</body>
</html>
